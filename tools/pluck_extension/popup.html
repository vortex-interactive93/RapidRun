<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pluck Harvester 2.8</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel-header">
  <div class="logo-row">
    <span class="brand-tag">RAPIDRUN CORE</span>
    <span class="status-indicator live">LIVE DOM</span>
  </div>
  <h2>Pluck Harvester 2.8</h2>
  <p class="subtitle">Autonomous Storytelling & Catalog Ingestion Engine</p>
</div>

<div class="action-grid">
  <button id="pluckAisleBtn" class="primary-btn">⚡ QUICK PLUCK (GRID)</button>
  <button id="deepCrawlBtn" class="action-btn gold" style="display: none;">💎 DEEP HARVEST ALL</button>
  <button id="exportBtn" class="action-btn green" style="display: none;">📄 DOWNLOAD JSON</button>
</div>

<div id="progressBox" class="progress-box" style="display: none;">
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill"></div>
  </div>
  <div class="progress-labels">
    <span id="progressText">Harvesting...</span>
    <span id="progressPercent">0%</span>
  </div>
</div>

<div id="status" class="status-box">Ready to harvest store catalog.</div>

<div id="inspectorDeck" class="inspector-deck" style="display: none;">
  <div class="deck-header">
    <span id="inspectorCount">0 IN-STORE SKUS</span>
    <span class="sync-tag">DOM VERIFIED</span>
  </div>
  <div id="inspectorList" class="inspector-list"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
