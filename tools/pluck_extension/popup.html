<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pluck - RapidRun BBW Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel-header">
  <div class="logo-row">
    <span class="brand-tag">RAPIDRUN CORE</span>
    <span class="status-indicator live">LIVE DOM</span>
  </div>
  <h2>⚡ Pluck Exporter 3.1</h2>
  <p class="subtitle">Boutique Room Catalog Harvester & PDP Enricher</p>
</div>

<div class="action-grid">
  <div class="field-group">
    <label for="filenameInput" class="field-label">TARGET ROOM FILENAME:</label>
    <input type="text" id="filenameInput" value="catalog.json" spellcheck="false" />
  </div>

  <button id="pluckAutoScrollBtn" class="primary-btn">🧲 AUTO-SCROLL & PLUCK ALL</button>
  <button id="pluckQuickBtn" class="action-btn gold">⚡ QUICK PLUCK (VISIBLE)</button>
  <button id="copyJsonBtn" class="action-btn purple">📋 COPY TO CLIPBOARD</button>
  <button id="downloadJsonBtn" class="action-btn green">📄 DOWNLOAD JSON</button>
  <button id="enrichNotesBtn" class="action-btn blue">✨ ENRICH MISSING NOTES</button>
  <input type="file" id="fileInput" accept=".json" style="display:none;" />
</div>

<div id="status" class="status-box">Ready to harvest store catalog.</div>

<script src="popup.js"></script>
</body>
</html>
