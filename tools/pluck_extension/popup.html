<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pluck - RapidRun Multi-Store Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel-header">
  <div class="logo-row">
    <span class="brand-tag">RAPIDRUN CORE</span>
    <span class="status-indicator live">LIVE DOM</span>
  </div>
  <h2>⚡ Pluck Exporter 4.2</h2>
  <p class="subtitle">Multi-Store Catalog Harvester & PDP Enricher</p>
</div>

<div class="action-grid">
  <div class="field-group">
    <label for="storeSelect" class="field-label">TARGET STORE ADAPTER:</label>
    <select id="storeSelect">
      <option value="auto" selected>Auto-Detect Store</option>
      <option value="bbw">Bath & Body Works</option>
      <option value="aldi">ALDI (Instacart Storefront)</option>
    </select>
  </div>

  <div class="field-group">
    <label for="filenameInput" class="field-label">TARGET ROOM FILENAME:</label>
    <input type="text" id="filenameInput" value="catalog.json" spellcheck="false" />
  </div>

  <button id="pluckAutoScrollBtn" class="primary-btn">🧲 AUTO-SCROLL & PLUCK ALL</button>

  <div class="btn-row">
    <button id="pluckQuickBtn" class="action-btn gold">⚡ QUICK PLUCK</button>
    <button id="copyJsonBtn" class="action-btn purple">📋 COPY JSON</button>
  </div>

  <div class="btn-row">
    <button id="downloadJsonBtn" class="action-btn green">📄 DOWNLOAD</button>
    <button id="enrichNotesBtn" class="action-btn blue">✨ ENRICH DETAILS</button>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none;" />
</div>

<div id="status" class="status-box">Ready to harvest store catalog.</div>

<script src="popup.js"></script>
</body>
</html>
