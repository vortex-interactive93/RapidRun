name: rapidrun
description: "RapidRun - A business mobile application for efficient operations and management."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  rapidrun_shared:
    path: packages/rapidrun_shared

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # For persistent data storage
  shared_preferences: ^2.2.2
  
  # Firebase packages for enhanced performance and features
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_auth: ^5.3.3
  firebase_analytics: ^11.3.4
  firebase_messaging: ^15.1.4
  firebase_crashlytics: ^4.1.2
  firebase_performance: ^0.10.0+8
  
  # Google Sign-In for authentication
  google_sign_in: ^6.1.5
  
  # Enhanced image loading and caching
  cached_network_image: ^3.4.1
  
  # Payment processing with Stripe (modern packages)
  flutter_stripe: ^11.0.0
  pay: ^2.0.0
  http: ^1.1.0
  
  # Additional dependencies for payments
  uuid: ^4.2.1
  intl: ^0.20.2
  
  # Missing dependencies identified by analyzer
  crypto: ^3.0.3
  path_provider: ^2.1.1
  flutter_cache_manager: ^3.4.1
  
  # Advanced State Management with Riverpod
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Real-time features dependencies
  geolocator: ^10.1.0
  google_maps_flutter: ^2.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  permission_handler: ^11.2.0
  url_launcher: ^6.2.2
  
  # Reactive programming
  rxdart: ^0.28.0
  # For picking profile images
  image_picker: ^1.1.2
  # Apple Sign In
  sign_in_with_apple: ^6.1.0
  # SVG rendering for logo assets
  flutter_svg: ^2.0.9
  # Biometric authentication
  local_auth: ^2.3.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Native splash screen generation
  flutter_native_splash: ^2.4.1
  
  # Code generation for Riverpod
  riverpod_generator: ^2.6.4
  build_runner: ^2.5.4
  
  # Testing dependencies for comprehensive test suite
  mockito: ^5.4.6
  integration_test:
    sdk: flutter
  patrol: ^3.12.0
  network_image_mock: ^2.1.1
  # Launcher icon generation
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/stores/
  # ALDI assets
  - assets/stores/aldi/
  - assets/data/
  - assets/data/aldi/
  # Bath & Body Works assets
  - assets/stores/bath_and_body_works/
  - assets/stores/bath_and_body_works/body_care/
  - assets/stores/bath_and_body_works/body_care/bath_shower/
  - assets/stores/bath_and_body_works/body_care/fragrance/
  - assets/stores/bath_and_body_works/body_care/moisturizers/
  - assets/stores/bath_and_body_works/body_care/minis/
  - assets/stores/bath_and_body_works/body_care/skin_care/
  - assets/stores/bath_and_body_works/candles/
  - assets/stores/bath_and_body_works/wallflowers_diffusers/
  - assets/stores/bath_and_body_works/hand_soaps_sanitizers/
  - assets/stores/bath_and_body_works/mens_shop/
  - assets/stores/bath_and_body_works/laundry/
  # Configuration assets (subcategory lists, schemas)
  - assets/config/
  - assets/images/
  - assets/logos/
  - assets/restaurant_logos/
  - assets/categories/
  - assets/products/
  - assets/branding/

  # Custom fonts from your assets
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  # Base image path required (either this or both image_path_android & image_path_ios must be present)
  image_path: assets/branding/icon_foreground.png
  image_path_ios: assets/branding/icon_foreground.png
  # Use a solid dark background instead of the gold circle image.
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # Optional monochrome icon (Android 13+ themed icons). Provide a simplified single-color PNG.
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  remove_alpha_ios: true

# Native splash screen configuration
# Option A (current): solid dark background color matching icon background.
# Option B (later): replace 'color' with 'background_image' once you export a gradient PNG (e.g. assets/branding/splash_bg.png).
flutter_native_splash:
  color: "#181818" # match in-app header
  image: assets/branding/icon_foreground.png # replace with splash_logo.png (larger lockup) when ready
  android_12:
    color: "#181818"
    image: assets/branding/icon_foreground.png
